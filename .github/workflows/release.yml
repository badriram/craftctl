name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo test
      - run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/craftctl \
            target/aarch64-apple-darwin/release/craftctl target/x86_64-apple-darwin/release/craftctl
          cp LICENSE-MIT LICENSE-APACHE NOTICE README.md dist/
          tar -czf craftctl-macos-universal.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: craftctl-macos-universal.tar.gz
  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    # 22.04 keeps the glibc requirement low, so the binary runs on older distributions too.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo test
      - run: |
          cargo build --release
          mkdir dist
          cp target/release/craftctl LICENSE-MIT LICENSE-APACHE NOTICE README.md dist/
          tar -czf craftctl-linux-${{ matrix.arch }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: craftctl-linux-${{ matrix.arch }}.tar.gz
  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum craftctl-*.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" craftctl-*.tar.gz SHA256SUMS.txt --generate-notes
